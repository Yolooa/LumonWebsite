<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c0a">
  <meta name="description" content="Lumon Studio browser IDE">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230b0c0a'/%3E%3Cpath d='m18 22 10 10-10 10M34 42h14' fill='none' stroke='%23d8ff00' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>Lumon Studio / IDE</title>
  <style>
    :root {
      --bg: #0b0c0a;
      --panel: #11130f;
      --panel-2: #161914;
      --panel-3: #1c201a;
      --editor: #0e100d;
      --text: #f0f0e9;
      --text-soft: #b5b9ae;
      --muted: #737970;
      --line: rgba(240, 240, 233, 0.11);
      --line-strong: rgba(240, 240, 233, 0.2);
      --accent: #d8ff00;
      --accent-rgb: 216, 255, 0;
      --blue: #78a9ff;
      --orange: #ff9d5c;
      --red: #ff6961;
      --green: #7ad69b;
      --sidebar-width: 252px;
      --preview-width: 36vw;
      --header-h: 48px;
      --status-h: 24px;
      --sans: "Google Sans Flex", "Helvetica Neue", Helvetica, Arial,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --ease: cubic-bezier(0.16, 1, 0.3, 1);
      --spring: cubic-bezier(0.2, 1.35, 0.35, 1);
    }

    [data-theme="light"] {
      --bg: #e9e9e2;
      --panel: #f3f3ed;
      --panel-2: #e7e7df;
      --panel-3: #dcddd4;
      --editor: #f8f8f3;
      --text: #11120f;
      --text-soft: #3d4039;
      --muted: #777b71;
      --line: rgba(8, 8, 8, 0.11);
      --line-strong: rgba(8, 8, 8, 0.22);
      --accent: #b9df00;
      --accent-rgb: 185, 223, 0;
      --blue: #3157d8;
      --orange: #c75b1b;
      --red: #bd3028;
      --green: #3c7d51;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      min-width: 320px;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    textarea {
      color: inherit;
      font: inherit;
    }

    button {
      border: 0;
      background: none;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    [hidden] {
      display: none !important;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }

    .svg-sprite {
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    }

    .icon {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.7;
    }

    .icon-sm {
      width: 13px;
      height: 13px;
    }

    .boot-gate {
      position: fixed;
      inset: 0;
      z-index: 5000;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(var(--accent-rgb), 0.08), transparent 36%),
        var(--bg);
      transition: opacity 0.42s ease, visibility 0.42s ease;
    }

    .boot-gate.is-ready {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-copy {
      display: grid;
      width: min(310px, calc(100vw - 40px));
      justify-items: center;
      gap: 10px;
      text-align: center;
    }

    .boot-mark {
      display: grid;
      width: 54px;
      height: 54px;
      place-items: center;
      color: #0a0b08;
      background: var(--accent);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 0 42px rgba(var(--accent-rgb), 0.18);
      animation: bootMark 1.2s var(--spring) both;
    }

    .boot-copy strong {
      margin-top: 4px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
    }

    .boot-copy span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 8px;
    }

    .boot-bar {
      width: 100%;
      height: 2px;
      margin-top: 8px;
      overflow: hidden;
      background: var(--line);
    }

    .boot-bar i {
      display: block;
      width: 42%;
      height: 100%;
      background: var(--accent);
      animation: bootProgress 1.1s ease-in-out infinite alternate;
    }

    .ide-app {
      display: grid;
      width: 100%;
      height: 100%;
      grid-template-rows: var(--header-h) minmax(0, 1fr) var(--status-h);
      opacity: 1;
    }

    .app-header {
      position: relative;
      z-index: 8;
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 13px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      animation: headerIn 0.55s var(--ease) both;
    }

    .studio-brand {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 9px;
    }

    .studio-brand-mark {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      flex: 0 0 auto;
      color: #090a07;
      background: var(--accent);
      border-radius: 6px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 900;
    }

    .studio-brand-copy {
      display: grid;
      min-width: 0;
      gap: 1px;
    }

    .studio-brand-copy strong {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .studio-brand-copy span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 7px;
      letter-spacing: 0.08em;
    }

    .header-divider {
      width: 1px;
      height: 22px;
      background: var(--line);
    }

    .workspace-name {
      display: inline-flex;
      min-width: 0;
      max-width: 280px;
      align-items: center;
      gap: 7px;
      padding: 5px 8px;
      color: var(--text-soft);
      border: 1px solid transparent;
      border-radius: 5px;
      font-family: var(--mono);
      font-size: 8px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .workspace-name:hover {
      background: var(--panel-2);
      border-color: var(--line);
    }

    .workspace-name span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .workspace-name .sync-dot {
      width: 6px;
      height: 6px;
      flex: 0 0 auto;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(122, 214, 155, 0.08);
    }

    .header-actions {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      margin-left: auto;
    }

    .tool-button {
      position: relative;
      display: inline-flex;
      min-width: 30px;
      height: 30px;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 8px;
      color: var(--text-soft);
      border: 1px solid transparent;
      border-radius: 5px;
      transition:
        color 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.22s var(--spring);
    }

    .tool-button:hover,
    .tool-button[aria-pressed="true"] {
      color: var(--text);
      background: var(--panel-2);
      border-color: var(--line);
      transform: translateY(-1px);
    }

    .tool-button.is-primary {
      color: #090a07;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 700;
    }

    .tool-button.is-primary:hover {
      color: #090a07;
      background: #e2ff45;
      border-color: #e2ff45;
    }

    .tool-button span {
      font-size: 8px;
      font-weight: 650;
      white-space: nowrap;
    }

    .user-button {
      display: inline-flex;
      min-width: 30px;
      height: 30px;
      align-items: center;
      gap: 7px;
      padding: 0 8px 0 4px;
      color: var(--text-soft);
      border: 1px solid var(--line);
      border-radius: 999px;
      transition: background 0.2s ease, transform 0.22s var(--spring);
    }

    .user-button:hover {
      background: var(--panel-2);
      transform: translateY(-1px);
    }

    .user-avatar {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      color: #0a0b08;
      background: var(--accent);
      border-radius: 50%;
      font-family: var(--mono);
      font-size: 7px;
      font-weight: 800;
    }

    .user-button > span:last-child {
      max-width: 112px;
      overflow: hidden;
      font-size: 8px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ide-shell {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-columns: 46px var(--sidebar-width) minmax(0, 1fr) var(--preview-width);
      overflow: hidden;
      background: var(--editor);
    }

    body.preview-hidden .ide-shell {
      grid-template-columns: 46px var(--sidebar-width) minmax(0, 1fr) 0;
    }

    .activity-bar {
      position: relative;
      z-index: 5;
      display: flex;
      min-height: 0;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 6px 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
      animation: activityIn 0.6s 0.06s var(--ease) both;
    }

    .activity-button {
      position: relative;
      display: grid;
      width: 34px;
      height: 36px;
      place-items: center;
      color: var(--muted);
      border-radius: 5px;
      transition: color 0.18s ease, background 0.18s ease;
    }

    .activity-button:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .activity-button[aria-selected="true"] {
      color: var(--text);
      background: var(--panel-3);
    }

    .activity-button[aria-selected="true"]::before {
      content: "";
      position: absolute;
      left: -6px;
      width: 2px;
      height: 19px;
      background: var(--accent);
      border-radius: 99px;
    }

    .activity-spacer {
      flex: 1;
    }

    .sidebar {
      position: relative;
      z-index: 4;
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: 39px minmax(0, 1fr) auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
      animation: sidebarIn 0.62s 0.1s var(--ease) both;
    }

    .sidebar-head {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 10px 0 13px;
      border-bottom: 1px solid var(--line);
    }

    .sidebar-head strong {
      color: var(--text-soft);
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sidebar-head-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .mini-button {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      color: var(--muted);
      border-radius: 4px;
      transition: color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .mini-button:hover {
      color: var(--text);
      background: var(--panel-2);
      transform: translateY(-1px);
    }

    .sidebar-view {
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    .sidebar-view[hidden] {
      display: none !important;
    }

    .file-panel {
      display: grid;
      min-height: 100%;
      grid-template-rows: minmax(0, 1fr);
    }

    .file-tree {
      min-height: 0;
      padding: 5px 5px 12px;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--line-strong) transparent;
    }

    .tree-item {
      position: relative;
      display: flex;
      width: 100%;
      min-height: 27px;
      align-items: center;
      gap: 6px;
      padding: 0 5px;
      color: var(--text-soft);
      border-radius: 4px;
      text-align: left;
      transition: color 0.16s ease, background 0.16s ease;
      animation: treeRise 0.28s var(--ease) both;
    }

    .tree-item:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .tree-item.is-active {
      color: var(--text);
      background: rgba(var(--accent-rgb), 0.09);
    }

    .tree-item.is-active::before {
      content: "";
      position: absolute;
      left: 0;
      width: 2px;
      height: 15px;
      background: var(--accent);
      border-radius: 99px;
    }

    .tree-item .tree-chevron {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      color: var(--muted);
      transition: transform 0.2s ease;
    }

    .tree-item[data-type="folder"][aria-expanded="true"] .tree-chevron {
      transform: rotate(90deg);
    }

    .tree-item .file-type-icon {
      display: inline-grid;
      width: 16px;
      height: 16px;
      place-items: center;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .tree-item[data-type="folder"] .file-type-icon {
      color: var(--orange);
    }

    .tree-item[data-language="html"] .file-type-icon {
      color: var(--orange);
    }

    .tree-item[data-language="css"] .file-type-icon,
    .tree-item[data-language="scss"] .file-type-icon {
      color: var(--blue);
    }

    .tree-item[data-language="javascript"] .file-type-icon,
    .tree-item[data-language="typescript"] .file-type-icon {
      color: var(--accent);
    }

    .tree-name {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tree-dirty {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      background: var(--accent);
      border-radius: 50%;
    }

    .search-panel {
      display: grid;
      min-height: 100%;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .search-box {
      display: grid;
      gap: 5px;
      padding: 9px;
      border-bottom: 1px solid var(--line);
    }

    .search-input-wrap {
      position: relative;
    }

    .search-input-wrap .icon {
      position: absolute;
      left: 8px;
      top: 50%;
      width: 12px;
      height: 12px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 31px;
      padding: 0 8px 0 27px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
      font-size: 9px;
    }

    .search-input:focus {
      border-color: rgba(var(--accent-rgb), 0.55);
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.08);
    }

    .search-meta {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 7px;
    }

    .search-results {
      min-height: 0;
      padding: 5px;
      overflow: auto;
    }

    .search-result {
      display: grid;
      width: 100%;
      gap: 2px;
      padding: 7px;
      color: var(--text-soft);
      border-radius: 4px;
      text-align: left;
    }

    .search-result:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .search-result strong {
      overflow: hidden;
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 600;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .search-result span {
      overflow: hidden;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 7px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .empty-state {
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 5px;
      min-height: 120px;
      padding: 16px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1.55;
      text-align: center;
    }

    .empty-state strong {
      color: var(--text-soft);
      font-size: 9px;
    }

    .sidebar-footer {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      padding: 7px;
      border-top: 1px solid var(--line);
    }

    .sidebar-footer button {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      justify-content: center;
      gap: 5px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid transparent;
      border-radius: 4px;
      font-size: 7px;
      transition: color 0.18s ease, border-color 0.18s ease;
    }

    .sidebar-footer button:hover {
      color: var(--text);
      border-color: var(--line);
    }

    .sidebar-resizer {
      position: absolute;
      z-index: 12;
      left: calc(46px + var(--sidebar-width) - 3px);
      top: 0;
      bottom: 0;
      width: 6px;
      cursor: col-resize;
      touch-action: none;
    }

    .sidebar-resizer::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: transparent;
      transition: background 0.18s ease;
    }

    .sidebar-resizer:hover::after,
    body.is-resizing .sidebar-resizer::after {
      background: var(--accent);
    }

    .editor-panel {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: 36px 25px minmax(0, 1fr);
      background: var(--editor);
      animation: editorIn 0.64s 0.12s var(--ease) both;
    }

    .editor-tabs {
      display: flex;
      min-width: 0;
      overflow-x: auto;
      overflow-y: hidden;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      scrollbar-width: none;
    }

    .editor-tabs::-webkit-scrollbar {
      display: none;
    }

    .editor-tab {
      position: relative;
      display: inline-flex;
      min-width: 112px;
      max-width: 210px;
      height: 35px;
      align-items: center;
      gap: 6px;
      padding: 0 9px 0 11px;
      color: var(--muted);
      background: var(--panel);
      border-right: 1px solid var(--line);
      font-size: 8px;
      transition: color 0.16s ease, background 0.16s ease;
    }

    .editor-tab:hover {
      color: var(--text-soft);
      background: var(--panel-2);
    }

    .editor-tab.is-active {
      color: var(--text);
      background: var(--editor);
    }

    .editor-tab.is-active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--accent);
    }

    .tab-label {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .tab-dirty {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      background: var(--accent);
      border-radius: 50%;
    }

    .tab-close {
      display: grid;
      width: 17px;
      height: 17px;
      place-items: center;
      flex: 0 0 auto;
      color: var(--muted);
      border-radius: 3px;
      opacity: 0;
    }

    .editor-tab:hover .tab-close,
    .editor-tab.is-active .tab-close {
      opacity: 1;
    }

    .tab-close:hover {
      color: var(--text);
      background: var(--panel-3);
    }

    .breadcrumb {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      padding: 0 12px;
      overflow: hidden;
      color: var(--muted);
      background: var(--editor);
      border-bottom: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 7px;
      white-space: nowrap;
    }

    .breadcrumb span {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .breadcrumb .icon {
      width: 10px;
      height: 10px;
      flex: 0 0 auto;
    }

    .editor-stage {
      position: relative;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
    }

    #monacoEditor {
      position: absolute;
      inset: 0;
    }

    .editor-welcome {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 10px;
      padding: 30px;
      background: var(--editor);
      text-align: center;
    }

    .welcome-glyph {
      display: grid;
      width: 68px;
      height: 68px;
      place-items: center;
      color: var(--accent);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 20px;
      font-weight: 800;
      animation: welcomeGlyph 1.2s var(--ease) both;
    }

    .editor-welcome strong {
      font-size: 18px;
      font-weight: 650;
    }

    .editor-welcome span {
      max-width: 340px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.6;
    }

    .welcome-shortcuts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 5px;
      margin-top: 5px;
    }

    .welcome-shortcuts kbd,
    .shortcut kbd {
      padding: 2px 5px;
      color: var(--muted);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 3px;
      font-family: var(--mono);
      font-size: 7px;
    }

    .preview-panel {
      position: relative;
      display: grid;
      min-width: 0;
      min-height: 0;
      grid-template-rows: 36px minmax(0, 1fr);
      overflow: hidden;
      background: var(--panel);
      border-left: 1px solid var(--line);
      animation: previewIn 0.68s 0.16s var(--ease) both;
    }

    body.preview-hidden .preview-panel {
      display: none;
    }

    .preview-head {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 3px;
      padding: 0 7px;
      border-bottom: 1px solid var(--line);
    }

    .panel-tab {
      display: inline-flex;
      height: 28px;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      color: var(--muted);
      border-radius: 4px;
      font-size: 8px;
    }

    .panel-tab[aria-selected="true"] {
      color: var(--text);
      background: var(--panel-2);
    }

    .preview-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      margin-left: auto;
    }

    .preview-body {
      position: relative;
      min-height: 0;
      background: #fff;
    }

    .preview-view,
    .console-view {
      position: absolute;
      inset: 0;
      min-width: 0;
      min-height: 0;
    }

    .preview-view iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .runtime-state {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 7px;
      padding: 20px;
      color: var(--muted);
      background: var(--panel);
      font-size: 8px;
      line-height: 1.5;
      text-align: center;
    }

    .runtime-state strong {
      color: var(--text-soft);
      font-size: 10px;
    }

    .console-view {
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      color: #d7d9d0;
      background: #090a08;
    }

    .console-output {
      min-height: 0;
      padding: 10px 12px;
      overflow: auto;
      font-family: var(--mono);
      font-size: 9px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .console-line {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr);
      gap: 7px;
      padding: 2px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }

    .console-line time {
      color: #646a60;
    }

    .console-line.is-error {
      color: #ff8a84;
    }

    .console-line.is-warn {
      color: #ffc268;
    }

    .statusbar {
      position: relative;
      z-index: 8;
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 13px;
      padding: 0 9px;
      color: var(--muted);
      background: var(--panel);
      border-top: 1px solid var(--line);
      font-family: var(--mono);
      font-size: 7px;
      animation: statusIn 0.62s 0.18s var(--ease) both;
    }

    .status-group {
      display: inline-flex;
      min-width: 0;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .status-group.is-right {
      margin-left: auto;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      background: var(--green);
      border-radius: 50%;
    }

    .dialog {
      width: min(440px, calc(100vw - 26px));
      margin: auto;
      padding: 0;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, 0.52);
    }

    .dialog::backdrop {
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(5px);
    }

    .dialog[open] {
      animation: dialogIn 0.3s var(--spring) both;
    }

    .dialog-inner {
      padding: 18px;
    }

    .dialog-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    .dialog-head span {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 7px;
      letter-spacing: 0.08em;
    }

    .dialog-head h2 {
      margin-top: 4px;
      font-size: 19px;
      font-weight: 650;
    }

    .dialog-form {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .dialog-form label {
      color: var(--muted);
      font-size: 8px;
    }

    .dialog-form input {
      width: 100%;
      height: 37px;
      padding: 0 10px;
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      outline: none;
      font-family: var(--mono);
      font-size: 10px;
    }

    .dialog-form input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.1);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-top: 4px;
    }

    .dialog-button {
      min-height: 32px;
      padding: 0 13px;
      color: var(--text-soft);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 8px;
      font-weight: 600;
    }

    .dialog-button:hover {
      color: var(--text);
      border-color: var(--line-strong);
    }

    .dialog-button.is-primary {
      color: #090a07;
      background: var(--accent);
      border-color: var(--accent);
    }

    .command-layer {
      position: fixed;
      inset: 0;
      z-index: 4000;
      display: grid;
      align-items: start;
      justify-items: center;
      padding: min(12vh, 110px) 16px 16px;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
    }

    .command-panel {
      width: min(620px, calc(100vw - 24px));
      overflow: hidden;
      color: var(--text);
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      box-shadow: 0 32px 100px rgba(0, 0, 0, 0.48);
      animation: commandIn 0.3s var(--spring) both;
    }

    .command-input-wrap {
      position: relative;
      border-bottom: 1px solid var(--line);
    }

    .command-input-wrap .icon {
      position: absolute;
      left: 13px;
      top: 50%;
      color: var(--muted);
      transform: translateY(-50%);
    }

    .command-input {
      width: 100%;
      height: 45px;
      padding: 0 15px 0 38px;
      color: var(--text);
      background: transparent;
      border: 0;
      outline: none;
      font-size: 11px;
    }

    .command-results {
      max-height: min(430px, 60vh);
      padding: 5px;
      overflow: auto;
    }

    .command-item {
      display: grid;
      width: 100%;
      grid-template-columns: 29px minmax(0, 1fr) auto;
      align-items: center;
      gap: 9px;
      padding: 8px;
      color: var(--text-soft);
      border-radius: 4px;
      text-align: left;
    }

    .command-item:hover,
    .command-item.is-selected {
      color: var(--text);
      background: var(--panel-2);
    }

    .command-icon {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      color: var(--muted);
      background: var(--panel-3);
      border-radius: 4px;
    }

    .command-copy {
      display: grid;
      min-width: 0;
      gap: 1px;
    }

    .command-copy strong,
    .command-copy span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .command-copy strong {
      font-size: 9px;
    }

    .command-copy span {
      color: var(--muted);
      font-size: 7px;
    }

    .command-item .shortcut {
      color: var(--muted);
      font-family: var(--mono);
      font-size: 7px;
    }

    .context-menu {
      position: fixed;
      z-index: 4200;
      display: grid;
      width: 154px;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.36);
      animation: contextIn 0.18s var(--ease) both;
    }

    .context-menu button {
      display: flex;
      min-height: 27px;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      color: var(--text-soft);
      border-radius: 3px;
      font-size: 8px;
      text-align: left;
    }

    .context-menu button:hover {
      color: var(--text);
      background: var(--panel-2);
    }

    .context-menu button.is-danger:hover {
      color: var(--red);
    }

    .toast {
      position: fixed;
      right: 15px;
      bottom: 34px;
      z-index: 4300;
      max-width: min(330px, calc(100vw - 26px));
      padding: 9px 11px;
      color: #0a0b08;
      background: var(--accent);
      border-radius: 4px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.24);
      font-size: 8px;
      font-weight: 650;
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.3s var(--spring);
    }

    .toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-overlay {
      position: fixed;
      inset: 0;
      z-index: 3;
      visibility: hidden;
      background: rgba(0, 0, 0, 0.46);
      opacity: 0;
      transition: opacity 0.22s ease, visibility 0.22s ease;
    }

    @keyframes bootMark {
      from { opacity: 0; transform: scale(0.7) rotate(-8deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes bootProgress {
      from { transform: translateX(-25%); }
      to { transform: translateX(170%); }
    }

    @keyframes headerIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes activityIn {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes sidebarIn {
      from { opacity: 0; transform: translateX(-12px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes editorIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes previewIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    @keyframes statusIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes treeRise {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes welcomeGlyph {
      from { opacity: 0; transform: scale(0.82); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes dialogIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes commandIn {
      from { opacity: 0; transform: translateY(-10px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes contextIn {
      from { opacity: 0; transform: translateY(-4px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 1120px) {
      .ide-shell {
        grid-template-columns: 46px var(--sidebar-width) minmax(0, 1fr);
      }

      .preview-panel {
        position: fixed;
        z-index: 20;
        top: var(--header-h);
        right: 0;
        bottom: var(--status-h);
        width: min(520px, calc(100vw - 46px));
        border-left: 1px solid var(--line-strong);
        box-shadow: -20px 0 60px rgba(0, 0, 0, 0.3);
        transform: translateX(0);
        transition: transform 0.34s var(--ease), visibility 0.34s ease;
      }

      body.preview-hidden .preview-panel {
        display: grid;
        visibility: hidden;
        transform: translateX(102%);
      }

      body.preview-open .mobile-overlay {
        visibility: visible;
        opacity: 1;
      }
    }

    @media (max-width: 760px) {
      :root {
        --header-h: 46px;
      }

      .studio-brand-copy span,
      .header-divider,
      .workspace-name,
      .tool-button > span,
      .user-button > span:last-child {
        display: none;
      }

      .app-header {
        gap: 6px;
        padding: 0 7px;
      }

      .header-actions {
        gap: 2px;
      }

      .ide-shell {
        grid-template-columns: 42px minmax(0, 1fr);
      }

      .sidebar {
        position: absolute;
        z-index: 22;
        top: 0;
        bottom: 0;
        left: 42px;
        width: min(280px, calc(100vw - 42px));
        box-shadow: 18px 0 52px rgba(0, 0, 0, 0.36);
        transform: translateX(-105%);
        transition: transform 0.32s var(--ease);
      }

      body.sidebar-open .sidebar {
        transform: translateX(0);
      }

      body.sidebar-open .mobile-overlay {
        visibility: visible;
        opacity: 1;
      }

      .sidebar-resizer {
        display: none;
      }

      .editor-panel {
        grid-column: 2;
        grid-row: 1;
      }

      .activity-bar {
        grid-column: 1;
      }

      .preview-panel {
        width: calc(100vw - 42px);
      }

      .statusbar {
        gap: 8px;
        overflow: hidden;
      }

      .status-group.is-optional {
        display: none;
      }

      .command-layer {
        align-items: end;
        padding: 10px;
      }

      .command-results {
        max-height: 55vh;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>

      const STARTER_FILES = [
        {
          path: "index.html",
          content: `<!doctype html>
<html lang="zh-CN">
<head>

<body>

        },
        {

          content: `:root {

* { box-sizing: border-box; }

main {
  width: min(720px, calc(100% - 40px));

        },
        {
          path: "app.js",
          content: `const button = document.querySelector("#counter");

button.addEventListener("click", () => {
  count += 1;
  output.textContent = String(count);
  console.log("点击次数", count);
});`
        },
        {
          path: "README.md",
          content: `# Lumon Workspace

这是一个保存在浏览器中的本地开发工作区。

- \`Ctrl S\` 保存
- \`Ctrl P\` 快速打开文件
- \`Ctrl Shift P\` 命令面板
- \`Ctrl Enter\` 运行 HTML 项目

工作区可通过左侧底部按钮导入或导出 JSON。`
        }
      ];

      let monaco = null;
      let editor = null;
      let workspace = null;
      let activePath = "";
      let openTabs = [];
      let expandedFolders = new Set(["src"]);
      let dirtyFiles = new Set();
      let models = new Map();
      let viewStates = new Map();
      let toastTimer = 0;
      let persistTimer = 0;
      let tabRenderTimer = 0;
      let nameDialogHandler = null;
      let confirmResolver = null;
      let currentUser = null;
      let currentSidebarView = "explorer";
      let currentPanelTab = "preview";
      let paletteMode = "commands";
      let paletteItems = [];
      let paletteIndex = 0;
      let problemCount = 0;
      let runtimeMessageCount = 0;
      let contextTarget = null;

      function safeStorageGet(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch {
          return false;
        }
      }

      function clone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function normalizePath(value) {
        const path = String(value || "")
          .trim()
          .replace(/\\/g, "/")
          .replace(/^\/+/, "")
          .replace(/\/+/g, "/")
          .replace(/\/$/, "");
        if (!path || path.split("/").some((part) => part === ".." || part === ".")) {
          throw new Error("路径不能为空，也不能包含 . 或 ..");
        }
        return path;
      }

      function dirname(path) {
        const parts = path.split("/");
        parts.pop();
        return parts.join("/");
      }

      function basename(path) {
        return path.split("/").pop() || path;
      }

      function extension(path) {
        const name = basename(path);
        const index = name.lastIndexOf(".");
        return index > 0 ? name.slice(index + 1).toLowerCase() : "";
      }

      function languageFor(path) {
        const name = basename(path).toLowerCase();
        if (name === "dockerfile") return "dockerfile";
        if (name === "makefile") return "plaintext";
        return LANGUAGE_MAP[extension(path)] || "plaintext";
      }

      function languageLabel(language) {
        return LANGUAGE_LABELS[language] || language || "Plain Text";
      }

      function defaultWorkspace() {
        return {
          version: 1,
          name: "lumon-workspace",
          folders: [],
          files: clone(STARTER_FILES),
          openTabs: ["index.html", "styles.css", "app.js", "README.md"],
          activePath: "index.html"
        };
      }

      function sanitizeWorkspace(input) {
        if (!input || typeof input !== "object") throw new Error("工作区数据无效");
        const fileMap = new Map();
        const sourceFiles = Array.isArray(input.files) ? input.files : [];
        for (const item of sourceFiles.slice(0, 500)) {
          try {
            const path = normalizePath(item?.path);
            if (!path || fileMap.has(path)) continue;
            fileMap.set(path, {
              path,
              content: String(item?.content ?? "").slice(0, 500000)
            });
          } catch {
            continue;
          }
        }
        if (!fileMap.size) {
          for (const file of STARTER_FILES) fileMap.set(file.path, clone(file));
        }
        const folderSet = new Set();
        const sourceFolders = Array.isArray(input.folders) ? input.folders : [];
        for (const folder of sourceFolders.slice(0, 300)) {
          try {
            const path = normalizePath(folder);
            if (path) folderSet.add(path);
          } catch {
            continue;
          }
        }
        for (const path of fileMap.keys()) {
          const parts = path.split("/");
          parts.pop();
          for (let index = 1; index <= parts.length; index += 1) {
            folderSet.add(parts.slice(0, index).join("/"));
          }
        }
        const available = new Set(fileMap.keys());
        const tabs = (Array.isArray(input.openTabs) ? input.openTabs : [])
          .map(String)
          .filter((path, index, all) => available.has(path) && all.indexOf(path) === index)
          .slice(0, 30);
        let active = String(input.activePath || "");
        if (!available.has(active)) active = tabs[0] || [...available][0] || "";
        return {
          version: 1,
          name: String(input.name || "lumon-workspace").trim().slice(0, 64) || "lumon-workspace",
          folders: [...folderSet].sort(),
          files: [...fileMap.values()],
          openTabs: tabs,
          activePath: active
        };
      }

      function loadWorkspace() {
        const raw = safeStorageGet(STORAGE_KEY);
        if (!raw) return defaultWorkspace();
        try {
          return sanitizeWorkspace(JSON.parse(raw));
        } catch {
          return defaultWorkspace();
        }
      }

      function findFile(path) {
        return workspace?.files.find((file) => file.path === path);
      }

      function persistWorkspace(status = "本地自动保存") {
        workspace.files = workspace.files.map((file) => {
          const model = models.get(file.path);
          return model ? { ...file, content: model.getValue() } : file;
        });
        workspace.openTabs = [...openTabs];
        workspace.activePath = activePath;
        const saved = safeStorageSet(STORAGE_KEY, JSON.stringify(workspace));
        $("#syncStatus").textContent = saved ? status : "本地保存失败";
        $("#syncStatus").style.color = saved ? "" : "var(--red)";
        return saved;
      }

      function schedulePersist() {
        window.clearTimeout(persistTimer);
        persistTimer = window.setTimeout(() => persistWorkspace(), 480);
      }

      function showToast(message) {
        const node = $("#toast");
        node.textContent = message;
        node.classList.add("is-visible");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => node.classList.remove("is-visible"), 2200);
      }

      function setWorkspaceVisible(visible) {
        $("#ideApp").setAttribute("aria-hidden", String(!visible));
        $("#bootGate").classList.toggle("is-ready", visible);
      }

      function setBootMessage(message) {
        $("#bootMessage").textContent = message;
      }

      function updateWorkspaceIdentity() {
        $("#workspaceName").textContent = workspace.name;
        document.title = `${workspace.name} / Lumon Studio`;
      }

      function updateUser(user) {
        currentUser = user;
        const name = user?.name || user?.username || "用户";
        $("#userName").textContent = name;
        $("#userAvatar").textContent = cloud?.initials?.(name) || name.slice(0, 1).toUpperCase();
      }

      function setSidebarView(view) {
        currentSidebarView = view === "search" ? "search" : "explorer";
        $("#explorerView").hidden = currentSidebarView !== "explorer";
        $("#searchView").hidden = currentSidebarView !== "search";
        $("#explorerActions").hidden = currentSidebarView !== "explorer";
        $("#sidebarTitle").textContent = currentSidebarView === "search" ? "Search" : "Explorer";
        $$(".activity-button[data-view]").forEach((button) => {
          button.setAttribute("aria-selected", String(button.dataset.view === currentSidebarView));
        });
        if (currentSidebarView === "search") {
          window.setTimeout(() => $("#globalSearchInput").focus(), 40);
        }
      }

      function setPreviewTab(tab) {
        currentPanelTab = tab === "console" ? "console" : "preview";
        $$("[data-panel-tab]").forEach((button) => {
          button.setAttribute("aria-selected", String(button.dataset.panelTab === currentPanelTab));
        });
        $("#previewView").hidden = currentPanelTab !== "preview";
        $("#consoleView").hidden = currentPanelTab !== "console";
      }

      function setPreviewVisible(visible) {
        document.body.classList.toggle("preview-hidden", !visible);
        document.body.classList.toggle("preview-open", visible);
        $("#previewToggle").setAttribute("aria-pressed", String(visible));
        safeStorageSet(LAYOUT_KEY, JSON.stringify({
          sidebarWidth: getComputedStyle(document.documentElement).getPropertyValue("--sidebar-width").trim(),
          previewVisible: visible
        }));
      }

      function togglePreview() {
        setPreviewVisible(document.body.classList.contains("preview-hidden"));
      }

      function closeMobilePanels() {
        document.body.classList.remove("sidebar-open", "preview-open");
        if (window.innerWidth <= 1120) setPreviewVisible(false);
      }

      function buildTreeModel() {
        const root = { type: "folder", name: "", path: "", children: new Map() };
        const ensureFolder = (path) => {
          const parts = path.split("/").filter(Boolean);
          let node = root;
          let current = "";
          for (const part of parts) {
            current = current ? `${current}/${part}` : part;
            if (!node.children.has(part)) {
              node.children.set(part, {
                type: "folder",
                name: part,
                path: current,
                children: new Map()
              });
            }
            node = node.children.get(part);
          }
          return node;
        };
        workspace.folders.forEach(ensureFolder);
        workspace.files.forEach((file) => {
          const folder = ensureFolder(dirname(file.path));
          folder.children.set(basename(file.path), {
            type: "file",
            name: basename(file.path),
            path: file.path,
            language: languageFor(file.path)
          });
        });
        return root;
      }

      function createTreeItem(node, depth) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "tree-item";
        button.dataset.path = node.path;
        button.dataset.type = node.type;
        button.style.paddingLeft = `${5 + depth * 13}px`;
        button.style.animationDelay = `${Math.min(depth * 18, 100)}ms`;
        if (node.type === "folder") {
          button.setAttribute("role", "treeitem");
          button.setAttribute("aria-expanded", String(expandedFolders.has(node.path)));
          const expanded = expandedFolders.has(node.path);
          button.innerHTML = `
            <svg class="icon tree-chevron"><use href="#i-chevron"></use></svg>
            <span class="file-type-icon"><svg class="icon icon-sm"><use href="#i-folder"></use></svg></span>
            <span class="tree-name"></span>
          `;
          if (expanded) $(".tree-chevron", button).style.transform = "rotate(90deg)";
        } else {
          button.dataset.language = node.language;
          if (node.path === activePath) button.classList.add("is-active");
          button.innerHTML = `
            <span class="file-type-icon"><svg class="icon icon-sm"><use href="#i-file"></use></svg></span>
            <span class="tree-name"></span>
            <span class="tree-dirty" ${dirtyFiles.has(node.path) ? "" : "hidden"}></span>
          `;
        }
        $(".tree-name", button).textContent = node.name;
        button.setAttribute("title", node.path || node.name);
        button.addEventListener("click", () => {
          if (node.type === "folder") {
            if (expandedFolders.has(node.path)) expandedFolders.delete(node.path);
            else expandedFolders.add(node.path);
            renderTree();
          } else {
            openFile(node.path);
          }
        });
        button.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          showContextMenu(event.clientX, event.clientY, node);
        });
        return button;
      }

      function appendTreeNode(parent, node, depth = 0) {
        const children = [...node.children.values()].sort((left, right) => {
          if (left.type !== right.type) return left.type === "folder" ? -1 : 1;
          return left.name.localeCompare(right.name, "zh-CN", { numeric: true });
        });
        children.forEach((child) => {
          parent.appendChild(createTreeItem(child, depth));
          if (child.type === "folder" && expandedFolders.has(child.path)) {
            appendTreeNode(parent, child, depth + 1);
          }
        });
      }

      function renderTree() {
        const tree = $("#fileTree");
        tree.replaceChildren();
        const model = buildTreeModel();
        if (!workspace.files.length && !workspace.folders.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = "<strong>工作区为空</strong><span>点击上方按钮新建文件</span>";
          tree.appendChild(empty);
          return;
        }
        appendTreeNode(tree, model);
      }

      function renderTabs() {
        const tabs = $("#editorTabs");
        tabs.replaceChildren();
        openTabs.forEach((path) => {
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = `editor-tab${path === activePath ? " is-active" : ""}`;
          tab.dataset.path = path;
          tab.setAttribute("role", "tab");
          tab.setAttribute("aria-selected", String(path === activePath));
          tab.innerHTML = `
            <span class="tab-label"></span>
            <span class="tab-dirty" ${dirtyFiles.has(path) ? "" : "hidden"}></span>
            <span class="tab-close" role="button" aria-label="关闭文件">
              <svg class="icon icon-sm"><use href="#i-x"></use></svg>
            </span>
          `;
          $(".tab-label", tab).textContent = basename(path);
          $(".tab-label", tab).title = path;
          tab.addEventListener("click", () => openFile(path));
          tab.addEventListener("auxclick", (event) => {
            if (event.button === 1) {
              event.preventDefault();
              closeTab(path);
            }
          });
          $(".tab-close", tab).addEventListener("click", (event) => {
            event.stopPropagation();
            closeTab(path);
          });
          tabs.appendChild(tab);
        });
        window.requestAnimationFrame(() => {
          $(".editor-tab.is-active", tabs)?.scrollIntoView({ block: "nearest", inline: "nearest" });
        });
      }

      function renderBreadcrumb() {
        const breadcrumb = $("#breadcrumb");
        breadcrumb.replaceChildren();
        const icon = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        icon.setAttribute("class", "icon");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", "#i-code");
        icon.appendChild(use);
        breadcrumb.appendChild(icon);
        if (!activePath) {
          const span = document.createElement("span");
          span.textContent = "未打开文件";
          breadcrumb.appendChild(span);
          return;
        }
        activePath.split("/").forEach((part) => {
          const span = document.createElement("span");
          span.textContent = part;
          breadcrumb.appendChild(span);
        });
      }

      function updateLanguageStatus() {
        const language = activePath ? languageFor(activePath) : "plaintext";
        $("#languageStatus").textContent = languageLabel(language);
      }

      function updateEditorChrome() {
        updateWorkspaceIdentity();
        renderTree();
        renderTabs();
        renderBreadcrumb();
        updateLanguageStatus();
        $("#editorWelcome").hidden = Boolean(activePath && editor?.getModel());
      }

      function changeUiForModel() {
        window.clearTimeout(tabRenderTimer);
        tabRenderTimer = window.setTimeout(() => {
          renderTabs();
          renderTree();
        }, 60);
        $("#syncStatus").textContent = "有未保存更改";
      }

      function modelForFile(file) {
        if (models.has(file.path)) return models.get(file.path);
        const uri = monaco.Uri.from({
          scheme: "inmemory",
          authority: "lumon",
          path: `/${file.path}`
        });
        const model = monaco.editor.createModel(file.content, languageFor(file.path), uri);
        model.onDidChangeContent(() => {
          const target = findFile(file.path);
          if (!target) return;
          target.content = model.getValue();
          dirtyFiles.add(file.path);
          changeUiForModel();
          schedulePersist();
        });
        models.set(file.path, model);
        return model;
      }

      function saveActiveFile() {
        if (!activePath || !editor?.getModel()) {
          showToast("没有可保存的文件");
          return;
        }
        const file = findFile(activePath);
        if (file) file.content = editor.getValue();
        dirtyFiles.delete(activePath);
        persistWorkspace("已保存");
        updateEditorChrome();
        showToast(`${basename(activePath)} 已保存`);
      }

      function openFile(path, position = null) {
        const file = findFile(path);
        if (!file || !editor) return;
        if (editor.getModel() && activePath) {
          viewStates.set(activePath, editor.saveViewState());
        }
        if (!openTabs.includes(path)) {
          openTabs.push(path);
          if (openTabs.length > 30) openTabs.shift();
        }
        activePath = path;
        const model = modelForFile(file);
        editor.setModel(model);
        const state = viewStates.get(path);
        if (state) editor.restoreViewState(state);
        if (position) {
          editor.setPosition(position);
          editor.revealPositionInCenter(position);
        }
        editor.focus();
        updateEditorChrome();
        persistWorkspace("工作区已同步");
        document.body.classList.remove("sidebar-open");
      }

      function closeTab(path) {
        const index = openTabs.indexOf(path);
        if (index < 0) return;
        openTabs.splice(index, 1);
        if (activePath === path) {
          if (editor?.getModel()) viewStates.delete(path);
          const next = openTabs[Math.max(0, index - 1)] || openTabs[index] || "";
          activePath = "";
          if (next) {
            openFile(next);
            return;
          }
          editor?.setModel(null);
          $("#editorWelcome").hidden = false;
        }
        updateEditorChrome();
        persistWorkspace();
      }

      function ensureParentFolders(path) {
        const parts = path.split("/");
        parts.pop();
        for (let index = 1; index <= parts.length; index += 1) {
          const folder = parts.slice(0, index).join("/");
          if (!workspace.folders.includes(folder)) workspace.folders.push(folder);
          expandedFolders.add(folder);
        }
      }

      function openNameDialog(options) {
        nameDialogHandler = options.onSubmit;
        $("#nameDialogEyebrow").textContent = options.eyebrow || "CREATE / FILE";
        $("#nameDialogTitle").textContent = options.title || "新建文件";
        $("#nameDialogLabel").textContent = options.label || "文件路径";
        const input = $("#nameDialogInput");
        input.value = options.value || "";
        input.placeholder = options.placeholder || "例如 src/component.js";
        $("#nameDialog").showModal();
        window.setTimeout(() => {
          input.focus();
          const dot = input.value.lastIndexOf(".");
          input.setSelectionRange(0, dot > 0 ? dot : input.value.length);
        }, 40);
      }

      function closeNameDialog() {
        nameDialogHandler = null;
        $("#nameDialog").close();
      }

      function createFile(path) {
        const normalized = normalizePath(path);
        if (findFile(normalized)) throw new Error("这个文件已经存在");
        if (workspace.folders.includes(normalized)) throw new Error("同名文件夹已经存在");
        if (workspace.files.length >= 500) throw new Error("工作区文件数量已达上限");
        ensureParentFolders(normalized);
        workspace.files.push({ path: normalized, content: "" });
        persistWorkspace();
        renderTree();
        openFile(normalized);
        showToast(`${normalized} 已创建`);
      }

      function createFolder(path) {
        const normalized = normalizePath(path);
        if (findFile(normalized)) throw new Error("同名文件已经存在");
        if (workspace.folders.includes(normalized)) throw new Error("这个文件夹已经存在");
        const parts = normalized.split("/");
        for (let index = 1; index <= parts.length; index += 1) {
          const folder = parts.slice(0, index).join("/");
          if (!workspace.folders.includes(folder)) workspace.folders.push(folder);
        }
        expandedFolders.add(normalized);
        persistWorkspace();
        renderTree();
        showToast(`${normalized} 文件夹已创建`);
      }

      function distinctCopyPath(path) {
        const folder = dirname(path);
        const name = basename(path);
        const dot = name.lastIndexOf(".");
        const stem = dot > 0 ? name.slice(0, dot) : name;
        const suffix = dot > 0 ? name.slice(dot) : "";
        let index = 1;
        while (true) {
          const candidate = `${folder ? `${folder}/` : ""}${stem} copy${index > 1 ? ` ${index}` : ""}${suffix}`;
          if (!findFile(candidate) && !workspace.folders.includes(candidate)) return candidate;
          index += 1;
        }
      }

      function duplicateFile(path) {
        const source = findFile(path);
        if (!source) return;
        const target = distinctCopyPath(path);
        workspace.files.push({ path: target, content: source.content });
        ensureParentFolders(target);
        persistWorkspace();
        renderTree();
        openFile(target);
        showToast("文件副本已创建");
      }

      function renameFile(oldPath, newValue) {
        const target = normalizePath(newValue);
        const source = findFile(oldPath);
        if (!source) return;
        if (target !== oldPath && findFile(target)) throw new Error("目标文件已经存在");
        if (workspace.folders.includes(target)) throw new Error("目标名称与文件夹冲突");
        source.path = target;
        ensureParentFolders(target);
        const model = models.get(oldPath);
        if (model) {
          model.dispose();
          models.delete(oldPath);
        }
        openTabs = openTabs.map((path) => path === oldPath ? target : path);
        if (activePath === oldPath) activePath = target;
        dirtyFiles.delete(oldPath);
        persistWorkspace();
        renderTree();
        if (activePath) openFile(target);
      }

      function renameFolder(oldPath, newValue) {
        const target = normalizePath(newValue);
        if (target === oldPath) return;
        if (workspace.folders.includes(target) || findFile(target)) throw new Error("目标名称已经存在");
        workspace.folders = workspace.folders.map((folder) => {
          if (folder === oldPath) return target;
          if (folder.startsWith(`${oldPath}/`)) return `${target}/${folder.slice(oldPath.length + 1)}`;
          return folder;
        });
        workspace.files.forEach((file) => {
          if (file.path.startsWith(`${oldPath}/`)) {
            file.path = `${target}/${file.path.slice(oldPath.length + 1)}`;
          }
        });
        [...models.keys()].forEach((path) => {
          if (path === oldPath || path.startsWith(`${oldPath}/`)) {
            models.get(path)?.dispose();
            models.delete(path);
          }
        });
        openTabs = openTabs.map((path) => (
          path.startsWith(`${oldPath}/`) ? `${target}/${path.slice(oldPath.length + 1)}` : path
        ));
        if (activePath.startsWith(`${oldPath}/`)) {
          activePath = `${target}/${activePath.slice(oldPath.length + 1)}`;
        }
        const nextFolders = new Set();
        expandedFolders.forEach((folder) => {
          if (folder === oldPath || folder.startsWith(`${oldPath}/`)) {
            nextFolders.add(`${target}/${folder.slice(oldPath.length + 1)}`.replace(/\/$/, ""));
          } else {
            nextFolders.add(folder);
          }
        });
        expandedFolders = nextFolders;
        persistWorkspace();
        renderTree();
        if (activePath) openFile(activePath);
      }

      function askConfirm(title, message) {
        $("#confirmTitle").textContent = title;
        $("#confirmMessage").textContent = message;
        $("#confirmDialog").showModal();
        return new Promise((resolve) => {
          confirmResolver = resolve;
        });
      }

      function resolveConfirm(value) {
        if (confirmResolver) {
          const resolve = confirmResolver;
          confirmResolver = null;
          resolve(value);
        }
        $("#confirmDialog").close();
      }

      async function deleteTreeEntry(node) {
        const confirmed = await askConfirm(
          node.type === "folder" ? "删除文件夹" : "删除文件",
          node.type === "folder"
            ? `确定删除 ${node.path} 及其中的所有文件吗？`
            : `确定删除 ${node.path} 吗？`
        );
        if (!confirmed) return;
        if (node.type === "folder") {
          workspace.folders = workspace.folders.filter((folder) => (
            folder !== node.path && !folder.startsWith(`${node.path}/`)
          ));
          const removed = workspace.files.filter((file) => file.path.startsWith(`${node.path}/`));
          removed.forEach((file) => {
            models.get(file.path)?.dispose();
            models.delete(file.path);
            dirtyFiles.delete(file.path);
          });
          workspace.files = workspace.files.filter((file) => !file.path.startsWith(`${node.path}/`));
          openTabs = openTabs.filter((path) => !path.startsWith(`${node.path}/`));
          if (activePath.startsWith(`${node.path}/`)) {
            activePath = openTabs[0] || "";
          }
        } else {
          models.get(node.path)?.dispose();
          models.delete(node.path);
          dirtyFiles.delete(node.path);
          workspace.files = workspace.files.filter((file) => file.path !== node.path);
          openTabs = openTabs.filter((path) => path !== node.path);
          if (activePath === node.path) activePath = openTabs[0] || "";
        }
        if (activePath && findFile(activePath)) openFile(activePath);
        else {
          editor?.setModel(null);
          $("#editorWelcome").hidden = false;
        }
        persistWorkspace();
        renderTree();
        showToast("已从工作区删除");
      }

      function showContextMenu(x, y, node) {
        contextTarget = node;
        const menu = $("#contextMenu");
        menu.replaceChildren();
        const actions = [
          {
            label: "重命名",
            icon: "i-edit",
            action: () => {
              openNameDialog({
                eyebrow: "RENAME / ENTRY",
                title: node.type === "folder" ? "重命名文件夹" : "重命名文件",
                label: node.type === "folder" ? "文件夹路径" : "文件路径",
                value: node.path,
                onSubmit: (value) => node.type === "folder"
                  ? renameFolder(node.path, value)
                  : renameFile(node.path, value)
              });
            }
          }
        ];

            label: "创建副本",

          });

          actions.push({

              title: "新建文件",

              onSubmit: createFile
            })
          });
        }

        });
        actions.forEach((item) => {

          $("span", button).textContent = item.label;

            menu.hidden = true;
            item.action();
          });
          menu.appendChild(button);
        });
        menu.hidden = false;
        const rect = menu.getBoundingClientRect();
        menu.style.left = `${Math.min(x, window.innerWidth - rect.width - 8)}px`;
        menu.style.top = `${Math.min(y, window.innerHeight - rect.height - 8)}px`;

      function renderSearch() {
        const query = $("#globalSearchInput").value.trim();
        const results = $("#searchResults");
        results.replaceChildren();
        if (!query) {
          $("#searchMeta").textContent = "输入关键词开始搜索";
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = "<strong>全工作区搜索</strong><span>支持文件名与文件内容</span>";
          results.appendChild(empty);
          return;
        }
        const matches = [];
        const lower = query.toLowerCase();
        workspace.files.forEach((file) => {
          const lines = file.content.split("\n");
          lines.forEach((line, index) => {
            if (line.toLowerCase().includes(lower) && matches.length < 120) {
              matches.push({
                path: file.path,
                line: index + 1,
                text: line.trim().slice(0, 180)
              });
            }
          });
        });
        $("#searchMeta").textContent = `${matches.length} 个结果${matches.length >= 120 ? "+" : ""}`;
        if (!matches.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = "<strong>没有匹配内容</strong><span>尝试更短的关键词</span>";
          results.appendChild(empty);
          return;
        }
        matches.forEach((match) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "search-result";
          button.innerHTML = "<strong></strong><span></span>";
          $("strong", button).textContent = `${match.path}:${match.line}`;
          $("span", button).textContent = match.text || "空白行";
          button.addEventListener("click", () => {
            openFile(match.path);
            window.setTimeout(() => {
              const position = { lineNumber: match.line, column: 1 };
              editor.setPosition(position);
              editor.revealPositionInCenter(position);
              editor.focus();
            }, 40);
          });
          results.appendChild(button);
        });
      }

      function resolveWorkspaceReference(fromPath, reference) {
        const value = String(reference || "").trim();
        if (!value || /^(?:[a-z]+:|#|\/\/)/i.test(value)) return null;
        const clean = value.split(/[?#]/)[0];
        if (!clean) return null;
        const candidates = [];
        if (clean.startsWith("/")) {
          candidates.push(clean.replace(/^\/+/, ""));
        } else {
          candidates.push(`${dirname(fromPath) ? `${dirname(fromPath)}/` : ""}${clean}`);
          candidates.push(clean);
        }
        for (const candidate of candidates) {
          try {
            const normalized = normalizePath(candidate);
            if (findFile(normalized)) return normalized;
          } catch {
            continue;
          }
        }
        return null;
      }

      function consoleHook() {
        return `<script>
          (() => {
            const send = (level, values) => {
              let text;
              try {
                text = values.map((value) => {
                  if (typeof value === "string") return value;
                  if (value instanceof Error) return value.stack || value.message;
                  try { return JSON.stringify(value, null, 2); }
                  catch { return String(value); }
                }).join(" ");
              } catch {
                text = "[无法序列化的值]";
              }
              parent.postMessage({ source: "lumon-ide-console", level, text }, "*");
            };
            for (const level of ["log", "info", "warn", "error"]) {
              const original = console[level].bind(console);
              console[level] = (...values) => {
                send(level, values);
                original(...values);
              };
            }
            window.addEventListener("error", (event) => {
              send("error", [event.message || "Runtime error"]);
            });
            window.addEventListener("unhandledrejection", (event) => {
              send("error", [event.reason || "Unhandled promise rejection"]);
            });
          })();
        <\/script>`;
      }

      function buildPreviewHtml(htmlFile) {
        const parser = new DOMParser();
        const documentNode = parser.parseFromString(htmlFile.content, "text/html");
        $$('link[rel="stylesheet"][href]', documentNode).forEach((link) => {
          const path = resolveWorkspaceReference(htmlFile.path, link.getAttribute("href"));
          if (!path) return;
          const style = documentNode.createElement("style");
          style.dataset.source = path;
          style.textContent = findFile(path)?.content || "";
          link.replaceWith(style);
        });
        $$("script[src]", documentNode).forEach((script) => {
          const path = resolveWorkspaceReference(htmlFile.path, script.getAttribute("src"));
          if (!path) return;
          const inline = documentNode.createElement("script");
          inline.textContent = findFile(path)?.content || "";
          if (script.type) inline.type = script.type;
          script.replaceWith(inline);
        });
        $$("img[src]", documentNode).forEach((image) => {
          const path = resolveWorkspaceReference(htmlFile.path, image.getAttribute("src"));
          if (!path || extension(path) !== "svg") return;
          const content = findFile(path)?.content || "";
          image.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(content)}`;
        });
        const head = documentNode.head;
        const hookWrap = documentNode.createElement("div");
        hookWrap.innerHTML = consoleHook();
        head.insertBefore(hookWrap.firstElementChild, head.firstChild);
        const doctype = /^<!doctype html>/i.test(htmlFile.content)
          ? "<!doctype html>"
          : "";
        return `${doctype}${documentNode.documentElement.outerHTML}`;
      }

      function addConsole(level, text) {
        runtimeMessageCount += 1;
        if (level === "error") {
          problemCount += 1;
          $("#problemStatus").textContent = `${problemCount} error${problemCount === 1 ? "" : "s"}`;
        }
        const line = document.createElement("div");
        line.className = `console-line${level === "error" ? " is-error" : level === "warn" ? " is-warn" : ""}`;
        const time = document.createElement("time");
        time.textContent = new Date().toLocaleTimeString("zh-CN", { hour12: false });
        const copy = document.createElement("span");
        copy.textContent = String(text || "");
        line.append(time, copy);
        $("#consoleOutput").appendChild(line);
        $("#consoleOutput").scrollTop = $("#consoleOutput").scrollHeight;
      }

      function runPreview() {
        if (!workspace) return;
        let htmlFile = activePath && extension(activePath) === "html"
          ? findFile(activePath)
          : null;
        if (!htmlFile) {
          htmlFile = findFile("index.html")
            || workspace.files.find((file) => extension(file.path) === "html");
        }
        if (!htmlFile) {
          setPreviewVisible(true);
          setPreviewTab("preview");
          $("#runtimeState").hidden = false;
          $("#runtimeState").innerHTML = "<strong>没有 HTML 入口</strong><span>新建一个 index.html 或打开 HTML 文件</span>";
          showToast("当前工作区没有可运行的 HTML 文件");
          return;
        }
        $("#consoleOutput").replaceChildren();
        problemCount = 0;
        runtimeMessageCount = 0;
        $("#problemStatus").textContent = "0 errors";
        addConsole("info", `Running ${htmlFile.path}`);
        try {
          $("#previewFrame").srcdoc = buildPreviewHtml(htmlFile);
          $("#runtimeState").hidden = true;
          setPreviewVisible(true);
          setPreviewTab("preview");
          showToast(`正在运行 ${htmlFile.path}`);
        } catch (error) {
          $("#runtimeState").hidden = false;
          $("#runtimeState").innerHTML = "<strong>运行失败</strong><span></span>";
          $("#runtimeState span").textContent = String(error.message || error);
          addConsole("error", error.message || error);
          setPreviewTab("console");
        }
      }

      function downloadText(filename, content, type = "text/plain") {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        anchor.click();
        window.setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function exportWorkspace() {
        persistWorkspace();
        const payload = JSON.stringify(workspace, null, 2);
        downloadText(`${workspace.name || "lumon-workspace"}.json`, payload, "application/json");
        showToast("工作区已导出");
      }

      async function importWorkspace(file) {
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const next = sanitizeWorkspace(parsed);
          const confirmed = await askConfirm(
            "导入工作区",
            `即将用 ${next.files.length} 个文件替换当前工作区，是否继续？`
          );
          if (!confirmed) return;
          [...models.values()].forEach((model) => model.dispose());
          models = new Map();
          viewStates = new Map();
          dirtyFiles = new Set();
          workspace = next;
          openTabs = [...next.openTabs];
          activePath = next.activePath;
          expandedFolders = new Set(next.folders.filter((folder) => !folder.includes("/")));
          persistWorkspace("工作区已导入");
          updateEditorChrome();
          if (activePath) openFile(activePath);
          showToast("工作区已导入");
        } catch (error) {
          showToast(`导入失败：${error.message || error}`);
        }
      }

      function commands() {
        return [
          {

          {

          {

          {

            detail: "搜索所有文件内容",

            keywords: "find search project",
            action: () => {
              setSidebarView("search");
              if (window.innerWidth <= 760) document.body.classList.add("sidebar-open");

            title: "切换预览面板",

          {

          },
          {

              const file = findFile(activePath);
              if (!file) return showToast("请先打开文件");
              downloadText(basename(file.path), editor.getValue(), "text/plain");

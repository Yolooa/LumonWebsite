      function renderPalette() {
        const query = $("#commandInput").value.trim().toLowerCase();
        const results = $("#commandResults");
        results.replaceChildren();
        if (paletteMode === "files") {
          paletteItems = workspace.files
            .filter((file) => !query || file.path.toLowerCase().includes(query))
            .slice(0, 80)
            .map((file) => ({
              title: basename(file.path),
              detail: file.path,
              icon: "i-file",
              action: () => openFile(file.path)
            }));
        } else {
          paletteItems = commands().filter((command) => {
            const haystack = `${command.title} ${command.detail} ${command.keywords}`.toLowerCase();
            return !query || haystack.includes(query);
          });
        }
        paletteIndex = Math.min(paletteIndex, Math.max(0, paletteItems.length - 1));
        if (!paletteItems.length) {
          const empty = document.createElement("div");
          empty.className = "empty-state";
          empty.innerHTML = "<strong>没有匹配结果</strong><span>尝试其他关键词</span>";
          results.appendChild(empty);
          return;
        }
        paletteItems.forEach((item, index) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `command-item${index === paletteIndex ? " is-selected" : ""}`;
          button.dataset.index = String(index);
          button.innerHTML = `
            <span class="command-icon"><svg class="icon icon-sm"><use href="#${item.icon || "i-command"}"></use></svg></span>
            <span class="command-copy"><strong></strong><span></span></span>
            <span class="shortcut"></span>
          `;
          $(".command-copy strong", button).textContent = item.title;
          $(".command-copy span", button).textContent = item.detail || "";
          $(".shortcut", button).textContent = item.shortcut || "";
          button.addEventListener("click", () => executePaletteItem(index));
          results.appendChild(button);
        });
        results.children[paletteIndex]?.scrollIntoView({ block: "nearest" });
      }

      function openPalette(mode = "commands") {
        paletteMode = mode;
        paletteIndex = 0;
        $("#commandInput").value = "";
        $("#commandInput").placeholder = mode === "files" ? "输入文件名" : "输入命令";
        $("#commandLayer").hidden = false;
        renderPalette();
        window.setTimeout(() => $("#commandInput").focus(), 20);
      }

      function closePalette() {
        $("#commandLayer").hidden = true;
        $("#commandInput").value = "";
      }

      function executePaletteItem(index) {
        const item = paletteItems[index];
        if (!item) return;
        closePalette();
        item.action();
      }

      function renameWorkspace() {
        openNameDialog({
          eyebrow: "WORKSPACE / NAME",
          title: "重命名工作区",
          label: "工作区名称",
          value: workspace.name,
          placeholder: "lumon-workspace",
          onSubmit: (value) => {
            const name = String(value || "").trim().slice(0, 64);
            if (!name) throw new Error("工作区名称不能为空");
            workspace.name = name;
            persistWorkspace();
            updateWorkspaceIdentity();
          }
        });
      }

      function currentTheme() {
        return document.documentElement.dataset.theme === "light" ? "light" : "dark";
      }

      function applyTheme(theme) {
        const next = theme === "light" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        safeStorageSet(THEME_KEY, next);
        const meta = $('meta[name="theme-color"]');
        if (meta) meta.content = next === "light" ? "#e9e9e2" : "#0b0c0a";
        $("#themeButton").setAttribute("aria-label", next === "light" ? "切换到深色主题" : "切换到浅色主题");
        if (monaco) monaco.editor.setTheme(next === "light" ? "lumon-light" : "lumon-dark");
      }

      function toggleTheme() {
        applyTheme(currentTheme() === "dark" ? "light" : "dark");
      }

      function defineThemes() {
        monaco.editor.defineTheme("lumon-dark", {
          base: "vs-dark",
          inherit: true,
          rules: [
            { token: "comment", foreground: "737970", fontStyle: "italic" },
            { token: "keyword", foreground: "d8ff00" },
            { token: "string", foreground: "8fd7a2" },
            { token: "number", foreground: "ffae6a" },
            { token: "type", foreground: "78a9ff" },
            { token: "function", foreground: "f1f0e9" },
            { token: "variable", foreground: "c2c6bb" },
            { token: "tag", foreground: "ff9d5c" },
            { token: "attribute.name", foreground: "78a9ff" }
          ],
          colors: {
            "editor.background": "#0e100d",
            "editor.foreground": "#e8e9e2",
            "editorLineNumber.foreground": "#454a42",
            "editorLineNumber.activeForeground": "#a7ada1",
            "editorCursor.foreground": "#d8ff00",
            "editor.selectionBackground": "#33400088",
            "editor.inactiveSelectionBackground": "#26300066",
            "editor.lineHighlightBackground": "#ffffff06",
            "editorIndentGuide.background1": "#ffffff0b",
            "editorIndentGuide.activeBackground1": "#d8ff0044",
            "editorWidget.background": "#161914",
            "editorWidget.border": "#ffffff1a",
            "editorSuggestWidget.background": "#161914",
            "editorSuggestWidget.selectedBackground": "#2a3025",
            "editorHoverWidget.background": "#161914",
            "editorHoverWidget.border": "#ffffff1a",
            "minimap.background": "#0e100d",
            "scrollbarSlider.background": "#ffffff18",
            "scrollbarSlider.hoverBackground": "#ffffff28",
            "scrollbarSlider.activeBackground": "#d8ff0055"
          }
        });
        monaco.editor.defineTheme("lumon-light", {
          base: "vs",
          inherit: true,
          rules: [
            { token: "comment", foreground: "777b71", fontStyle: "italic" },
            { token: "keyword", foreground: "4c6700" },
            { token: "string", foreground: "287346" },
            { token: "number", foreground: "b14d12" },
            { token: "type", foreground: "3157d8" },
            { token: "tag", foreground: "a7470c" },
            { token: "attribute.name", foreground: "3157d8" }
          ],
          colors: {
            "editor.background": "#f8f8f3",
            "editor.foreground": "#171913",
            "editorLineNumber.foreground": "#adb0a6",
            "editorLineNumber.activeForeground": "#4d5148",
            "editorCursor.foreground": "#5f7300",
            "editor.selectionBackground": "#cbe76c66",
            "editor.inactiveSelectionBackground": "#dce4c366",
            "editor.lineHighlightBackground": "#00000005",
            "editorIndentGuide.background1": "#00000010",
            "editorIndentGuide.activeBackground1": "#91ad1744",
            "editorWidget.background": "#f3f3ed",
            "editorWidget.border": "#0000001c",
            "editorSuggestWidget.background": "#f3f3ed",
            "editorSuggestWidget.selectedBackground": "#e0e4d4",
            "editorHoverWidget.background": "#f3f3ed",
            "minimap.background": "#f8f8f3"
          }
        });
      }

      function createEditor() {
        defineThemes();
        editor = monaco.editor.create($("#monacoEditor"), {
          theme: currentTheme() === "light" ? "lumon-light" : "lumon-dark",
          automaticLayout: false,
          fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
          fontSize: 13,
          lineHeight: 22,
          fontLigatures: true,
          minimap: { enabled: true, maxColumn: 90, renderCharacters: false },
          padding: { top: 12, bottom: 20 },
          smoothScrolling: !reducedMotion,
          cursorBlinking: reducedMotion ? "solid" : "smooth",
          cursorSmoothCaretAnimation: reducedMotion ? "off" : "on",
          bracketPairColorization: { enabled: true },
          guides: { bracketPairs: true, indentation: true },
          renderWhitespace: "selection",
          renderLineHighlight: "all",
          stickyScroll: { enabled: true },
          folding: true,
          foldingHighlight: true,
          showFoldingControls: "mouseover",
          glyphMargin: false,
          lineNumbersMinChars: 4,
          overviewRulerBorder: false,
          scrollBeyondLastLine: false,
          tabSize: 2,
          insertSpaces: true,
          detectIndentation: true,
          wordWrap: "off",
          suggest: { showStatusBar: true, preview: true },
          quickSuggestions: { other: true, comments: false, strings: true },
          acceptSuggestionOnEnter: "on",
          formatOnPaste: true,
          formatOnType: true,
          scrollbar: {
            verticalScrollbarSize: 10,
            horizontalScrollbarSize: 10,
            useShadows: false
          }
        });
        editor.onDidChangeCursorPosition((event) => {
          $("#cursorStatus").textContent = `Ln ${event.position.lineNumber}, Col ${event.position.column}`;
          const model = editor.getModel();
          if (model) {
            const language = model.getLanguageId();
            $("#languageStatus").textContent = languageLabel(language);
            $("#indentStatus").textContent = `Spaces: ${model.getOptions().tabSize}`;
          }
        });
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, saveActiveFile);
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, runPreview);
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyP, () => openPalette("files"));
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyMod.Shift | monaco.KeyCode.KeyP, () => openPalette("commands"));
        editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyB, toggleSidebar);
        const observer = new ResizeObserver(() => editor.layout());
        observer.observe($(".editor-stage"));
      }

      function toggleSidebar() {
        if (window.innerWidth <= 760) {
          document.body.classList.toggle("sidebar-open");
        } else {
          const current = Number.parseInt(
            getComputedStyle(document.documentElement).getPropertyValue("--sidebar-width"),
            10
          ) || 252;
          document.documentElement.style.setProperty("--sidebar-width", current > 0 ? "0px" : "252px");
          window.setTimeout(() => editor?.layout(), 260);
        }
      }

      function applyWorkspace(next, persist = true) {
        workspace = sanitizeWorkspace(next);
        openTabs = [...workspace.openTabs];
        activePath = workspace.activePath;
        expandedFolders = new Set(workspace.folders.filter((folder) => !folder.includes("/")));
        dirtyFiles = new Set();
        models.forEach((model) => model.dispose());
        models = new Map();
        viewStates = new Map();
        renderTree();
        renderTabs();
        if (persist) persistWorkspace("工作区已载入");
        if (activePath) openFile(activePath);
        else {
          editor?.setModel(null);
          $("#editorWelcome").hidden = false;
        }
        updateWorkspaceIdentity();
      }

      function loadMonaco() {
        return new Promise((resolve, reject) => {
          const request = window.require;
          if (typeof request !== "function") {
            reject(new Error("Monaco AMD loader 未加载"));
            return;
          }
          request.config({ paths: { vs: "vendor/monaco/vs" } });
          request(["vs/editor/editor.main"], (api) => {
            monaco = api;
            resolve(api);
          }, reject);
        });
      }

      async function guardSession() {
        if (!cloud) throw new Error("云端身份适配器未加载");
        setBootMessage("正在验证工作区身份");
        const resolved = await cloud.loadSession();
        if (!resolved || resolved.guest) {
          location.replace("loginaccount.html?next=ide.html");
          return null;
        }
        updateUser(resolved);
        return resolved;
      }

      function bindUi() {
        $("#saveButton").addEventListener("click", saveActiveFile);
        $("#runButton").addEventListener("click", runPreview);
        $("#previewRefresh").addEventListener("click", runPreview);
        $("#previewToggle").addEventListener("click", togglePreview);
        $("#mobilePreviewClose").addEventListener("click", () => setPreviewVisible(false));
        $("#themeButton").addEventListener("click", toggleTheme);
        $("#commandButton").addEventListener("click", () => openPalette("commands"));
        $("#workspaceNameButton").addEventListener("click", renameWorkspace);
        $("#userButton").addEventListener("click", () => {
          location.href = "personalindex5.html";
        });
        $("#newFileButton").addEventListener("click", () => openNameDialog({
          title: "新建文件",
          label: "文件路径",
          placeholder: "例如 src/main.ts",
          onSubmit: createFile
        }));
        $("#newFolderButton").addEventListener("click", () => openNameDialog({
          eyebrow: "CREATE / FOLDER",
          title: "新建文件夹",
          label: "文件夹路径",
          placeholder: "例如 src/components",
          onSubmit: createFolder
        }));
        $("#mobileSidebarToggle").addEventListener("click", () => {
          document.body.classList.toggle("sidebar-open");
        });
        $("#mobileOverlay").addEventListener("click", closeMobilePanels);
        $$(".activity-button[data-view]").forEach((button) => {
          button.addEventListener("click", () => {
            setSidebarView(button.dataset.view);
            if (window.innerWidth <= 760) document.body.classList.add("sidebar-open");
          });
        });
        $$("[data-panel-tab]").forEach((button) => {
          button.addEventListener("click", () => setPreviewTab(button.dataset.panelTab));
        });
        $("#consoleClear").addEventListener("click", () => {
          $("#consoleOutput").replaceChildren();
          problemCount = 0;
          $("#problemStatus").textContent = "0 errors";
        });
        $("#globalSearchInput").addEventListener("input", renderSearch);
        $("#importButton").addEventListener("click", () => $("#importInput").click());
        $("#exportButton").addEventListener("click", exportWorkspace);
        $("#importInput").addEventListener("change", async (event) => {
          const file = event.target.files?.[0];
          event.target.value = "";
          await importWorkspace(file);
        });

        const nameDialog = $("#nameDialog");
        $("#nameDialogClose").addEventListener("click", closeNameDialog);
        $("#nameDialogCancel").addEventListener("click", closeNameDialog);
        $("#nameDialogForm").addEventListener("submit", (event) => {
          event.preventDefault();
          const value = $("#nameDialogInput").value.trim();
          if (!value || !nameDialogHandler) return;
          try {
            const result = nameDialogHandler(value);
            if (result === false) return;
            nameDialogHandler = null;
            nameDialog.close();
          } catch (error) {
            showToast(error.message || String(error));
            $("#nameDialogInput").focus();
          }
        });
        nameDialog.addEventListener("cancel", (event) => {
          event.preventDefault();
          closeNameDialog();
        });

        $("#confirmForm").addEventListener("submit", (event) => {
          event.preventDefault();
          resolveConfirm(true);
        });
        $("#confirmCancel").addEventListener("click", () => resolveConfirm(false));
        $("#confirmDialog").addEventListener("cancel", (event) => {
          event.preventDefault();
          resolveConfirm(false);
        });

        $("#commandInput").addEventListener("input", () => {
          paletteIndex = 0;
          renderPalette();
        });
        $("#commandInput").addEventListener("keydown", (event) => {
          if (event.key === "ArrowDown") {
            event.preventDefault();
            paletteIndex = Math.min(paletteIndex + 1, paletteItems.length - 1);
            renderPalette();
          } else if (event.key === "ArrowUp") {
            event.preventDefault();
            paletteIndex = Math.max(0, paletteIndex - 1);
            renderPalette();
          } else if (event.key === "Enter") {
            event.preventDefault();
            executePaletteItem(paletteIndex);
          } else if (event.key === "Escape") {
            closePalette();
          }
        });
        $("#commandLayer").addEventListener("pointerdown", (event) => {
          if (event.target === $("#commandLayer")) closePalette();
        });
        window.addEventListener("message", (event) => {
          if (event.source !== $("#previewFrame").contentWindow) return;
          if (event.data?.source !== "lumon-ide-console") return;
          addConsole(event.data.level || "log", event.data.text || "");
        });

        document.addEventListener("click", () => {
          $("#contextMenu").hidden = true;
        });
        window.addEventListener("blur", () => {
          $("#contextMenu").hidden = true;
        });
        window.addEventListener("resize", () => {
          $("#contextMenu").hidden = true;
          editor?.layout();
        });

        const resizer = $("#sidebarResizer");
        resizer.addEventListener("pointerdown", (event) => {
          if (window.innerWidth <= 760) return;
          const startX = event.clientX;
          const startWidth = $("#sidebar").getBoundingClientRect().width;
          document.body.classList.add("is-resizing");
          resizer.setPointerCapture(event.pointerId);
          const move = (moveEvent) => {
            const width = Math.max(190, Math.min(420, startWidth + moveEvent.clientX - startX));
            document.documentElement.style.setProperty("--sidebar-width", `${width}px`);
            editor?.layout();
          };
          const stop = () => {
            document.body.classList.remove("is-resizing");
            resizer.removeEventListener("pointermove", move);
            resizer.removeEventListener("pointerup", stop);
            resizer.removeEventListener("pointercancel", stop);
            safeStorageSet(LAYOUT_KEY, JSON.stringify({
              sidebarWidth: getComputedStyle(document.documentElement).getPropertyValue("--sidebar-width").trim(),
              previewVisible: !document.body.classList.contains("preview-hidden")
            }));
          };
          resizer.addEventListener("pointermove", move);
          resizer.addEventListener("pointerup", stop);
          resizer.addEventListener("pointercancel", stop);
        });

        document.addEventListener("keydown", (event) => {
          const modifier = event.ctrlKey || event.metaKey;
          if (!modifier) {
            if (event.key === "Escape" && !$("#commandLayer").hidden) closePalette();
            return;
          }
          if (event.key.toLowerCase() === "s") {
            event.preventDefault();
            saveActiveFile();
          } else if (event.key.toLowerCase() === "n") {
            event.preventDefault();
            openNameDialog({
              title: "新建文件",
              label: "文件路径",
              placeholder: "例如 src/main.ts",
              onSubmit: createFile
            });
          } else if (event.key.toLowerCase() === "p" && event.shiftKey) {
            event.preventDefault();
            openPalette("commands");
          } else if (event.key.toLowerCase() === "p") {
            event.preventDefault();
            openPalette("files");
          } else if (event.key === "Enter") {
            event.preventDefault();
            runPreview();
          } else if (event.key.toLowerCase() === "b") {
            event.preventDefault();
            toggleSidebar();
          } else if (event.key.toLowerCase() === "f" && event.shiftKey) {
            event.preventDefault();
            setSidebarView("search");
            if (window.innerWidth <= 760) document.body.classList.add("sidebar-open");
          } else if (event.key.toLowerCase() === "w" && activePath) {
            event.preventDefault();
            closeTab(activePath);
          }
        });
      }

      async function boot() {
        try {
          applyTheme(safeStorageGet(THEME_KEY) || "dark");
          bindUi();
          await guardSession();
          setBootMessage("正在加载 Monaco 编辑器");
          await loadMonaco();
          setBootMessage("正在恢复本地工作区");
          let savedLayout = {};
          try {
            savedLayout = JSON.parse(safeStorageGet(LAYOUT_KEY) || "{}") || {};
          } catch {
            savedLayout = {};
          }
          document.documentElement.style.setProperty(
            "--sidebar-width",
            savedLayout.sidebarWidth || "252px"
          );
          createEditor();
          applyWorkspace(loadWorkspace(), true);
          if (window.innerWidth <= 1120) setPreviewVisible(false);
          else if (savedLayout.previewVisible === false) setPreviewVisible(false);
          setSidebarView("explorer");
          setPreviewTab("preview");
          window.setTimeout(() => {
            setWorkspaceVisible(true);
            editor.layout();
          }, reducedMotion ? 0 : 220);
        } catch (error) {
          setBootMessage(String(error.message || error));
          console.error("[Lumon Studio]", error);
        }
      }

      boot();
    })();
  </script>
